<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="./assets/notes.png">
    <link rel="manifest" href="./manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note app</title>
</head>
<body>
    <nav class="container-fluid">
            <div class="topbar row text-secondary">
            <header class="logo col-10 text-start fw-bold">
                <div class="menu">☰</div>
                <h1>Take a note</h1>
            </header>
            <div class="col-2 d-flex justify-content-end align-items-center">
                <button class="mode"></button>
            </div>
        </div>
    </nav>
    <section>
        <div class="container-fluid">
            <div class="row justify-content-center">
            <div class="side">
                <aside class="sidebar">
                    <div class="sidebar-menu">☰</div>
                    <div class="allnotes">All notes</div>
                    <div class="pinnednote">pinned notes</div>
                    <div class="donenotes">Done notes</div>
                    <div class="undonenotes">Undone notes</div>
                    <div class="installBtn">Install app</div>
                </aside>
                <div class="overlay"></div>
            </div>
            <div class="main col-10 my-1">
                <div class="noteArea">
                    <div class="noteblock row row-cols-1 row-cols-lg-2 g-4 m-2"></div>
    
                        <div class="row text-center align-items-center justify-content-center g-3 m-1">
                            <div class="col-auto">
                            <div class="prevPage"><</div>
                            </div>
                            <div class="col-auto">
                                <div class="currPage"></div>
                            </div>
                            <div class="col-auto">
                                <div class="nextPage">></div>
                            </div>
                            <button class="btn btn-primary note-add">Add a note</button>
                        </div>
                        <div class="takeNote row">
                            <form id="noteform">
                                <div class="close">X</div>
                                <div class="form-group">
                                    <label for="noteText">Enter note:</label>
                                </div>
                                <div class="note-data">
                                    <textarea class="note col-5 height-5" id="note" rows="2" placeholder="Enter your note here..." autofocus></textarea>
                                </div>
                                <div class="modal-action">
                                    <button class="btn btn-primary addNote col-auto">Save</button>
                                </div>
                                
                            </form>
                            
                        </div>
                        <div class="error row"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/swregister.js"></script>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="js/mode.js"></script>
    <script src="js/pagination.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/index.js"></script>
    
</body>
</html>
