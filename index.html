<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="./assets/notes.png">
    <link rel="manifest" href="./manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note app</title>
</head>
<body>
    <section class="container-fluid">
        <div class="topbar row text-secondary">
            <header class="logo col-10 text-start fw-bold d-flex align-items-center">
                <h1>
                    <a href="index.html"><i class="bi bi-card-checklist"></i></a>
                    Take a note</h1>
            </header>
            <div class="navbar col-2">
                <button href="#sidebar" class="navbar-toggler" data-bs-toggle="offcanvas" type="button" aria-controls="sidebar" aria-label="toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </section>
    <section>
        <div class="container">
            <div class="main col-12 my-1">
                <div class="noteArea">
                    <div class="noteblock row row-cols-1 row-cols-lg-2 g-4 m-2"></div>
                    
                    <nav class="row" aria-label="Page navigation">
                        <ul class="pagination justify-content-center align-items-center">
                            <li class="page-item"><a class="prevPage page-link" href="#">Previous</a></li>
                            <li class="page-item"><a class="currPage page-link" href="#"></a></li>
                            <li class="page-item"><a class="nextPage page-link" href="#">Next</a></li>
                        </ul>
                    </nav>
                        <div class="row text-center align-items-center justify-content-center g-3 m-1">
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#notemodal">Add a note</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebar-label">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close d-flex justify-content-end" data-bs-dismiss="offcanvas" aria-label="close"></button>
        </div>
        <div class="offcanvas-body d-flex justify-content-center align-items-center flex-column">
            <div class="note-nav allnotes">All notes</div>
            <div class="note-nav pinnednote">pinned notes</div>
            <div class="note-nav donenotes">Done notes</div>
            <div class="note-nav undonenotes">Undone notes</div>
            <div class="note-nav installBtn">Install app</div>
            <button class="mode pointer-event border-0"><i class="bi bi-moon"></i></button>
            <div class="overlay"></div>  
        </div>
    </div>

     <div class="modal fade" id="notemodal" tabindex="-1" aria-labelledby="notemodallabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="text-secondary">Enter note</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <textarea id="note-text" class="note" placeholder="Enter your note here..." autofocus></textarea>
                    <div class="error d-flex justify-content-start align-items-start mb-2"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary addNote col-auto">Save</button>
                    
                </div>
                
            </div>
        </div> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/swregister.js"></script>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="js/mode.js"></script>
    <script src="js/pagination.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/index.js"></script>
    
</body>
</html>
